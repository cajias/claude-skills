[project]
name = "claudeception"
version = "4.2.1"
description = "Continuous learning system that extracts reusable skills from Claude Code sessions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Raul Cajias" }]
keywords = ["claude", "ai", "learning", "skills", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hooks"]

# Ruff Configuration
[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes (unused imports, variables)
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear (common bugs)
    "W",     # pycodestyle warnings
    "C90",   # McCabe complexity
    "SIM",   # flake8-simplify
    "PIE",   # flake8-pie
    "PLR",   # Pylint refactoring
    "RET",   # flake8-return
    "ANN",   # flake8-annotations (type hints)
    "UP",    # pyupgrade
    "D",     # pydocstyle
    "N",     # pep8-naming
    "S",     # flake8-bandit (security)
    "BLE",   # flake8-blind-except
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EM",    # flake8-errmsg
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (commented-out code)
    "PGH",   # pygrep-hooks
    "PL",    # Pylint
    "TRY",   # tryceratops
    "FLY",   # flynt
    "PERF",  # Perflint
    "RUF",   # Ruff-specific
]

ignore = [
    "E203",    # Whitespace before ':' (conflicts with Black)
    "E501",    # Line too long (handled by formatter)
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "ISC001",  # Single line implicit string concat (conflicts with formatter)
    # Pragmatic ignores for hook scripts
    "BLE001",  # Blind except - hooks must not crash
    "DTZ005",  # Datetime timezone - not critical for local timestamps
    "TRY003",  # Raise vanilla args - acceptable for simple errors
    "TRY300",  # Try-consider-else - not always clearer
    "S110",    # Try-except-pass - intentional silent handling
    "PERF203", # Try-except in loop - sometimes needed
    "PTH123",  # builtin-open - acceptable
    "PTH111",  # os-path-expanduser - acceptable
    "PTH109",  # os-getcwd - acceptable
    "ERA001",  # Commented code - keep for reference
    "PLR2004", # Magic values - acceptable for weights/thresholds
    "C901",    # Complex functions - refactor later
    "PLR0911", # Too many returns - acceptable
    "PLR0912", # Too many branches - acceptable
    "B904",    # Raise without from - acceptable
    "SIM102",  # Collapsible if - not always clearer
    "SIM108",  # If-else-block-instead-of-if-exp - readability
    "SIM115",  # Open-file-with-context-handler - acceptable
    # Function-scoped imports are deliberate here: hooks import lazily inside
    # `except ImportError` fallback shims, and tests import inside test bodies so
    # modules resolve via pytest's pythonpath and stay patchable. (Rule postdates
    # the ruff>=0.8.0 floor pinned below.)
    "PLC0415", # Import not at top-level
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = [
    "S101",    # Allow assert in tests
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation
    "PLR2004", # Allow magic values in tests
    "PLR0913", # Allow many arguments in test functions
    "D103",    # Missing docstring in public function
    "ARG001",  # Unused arguments in test fixtures
    "BLE001",  # Blind except in test error handling
    "PERF401", # Manual list comprehension
    "PLW2901", # Redefined loop name
]
# Hook scripts have less strict requirements
"hooks/*.py" = [
    "ANN001",  # Missing type annotation - hooks are scripts
    "ANN201",  # Missing return type annotation
    "ANN204",  # Missing return type for special method
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "ARG001",  # Unused function argument - common in hooks
    "N999",    # Invalid module name (hyphens in filenames)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["hooks"]
force-single-line = false
lines-after-imports = 2

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

[tool.pytest.ini_options]
addopts = "--cov=hooks --cov-report=term-missing"
testpaths = ["hooks"]
# Tests import hook modules by bare name (hooks run as standalone scripts, not as a package)
pythonpath = ["hooks"]

[tool.coverage.run]
branch = true
source = ["hooks"]
omit = ["*/test_*.py", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
# Ratchet floor, not a target: 6 of 9 hook modules currently have no tests at all.
# Raise this as modules gain coverage; never lower it.
fail_under = 22
