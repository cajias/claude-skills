name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run markdownlint
        run: npm run lint:md
        continue-on-error: false

      - name: Run ls-lint
        run: npx ls-lint
        continue-on-error: false

      - name: Check required skill files
        run: |
          shopt -s nullglob
          skills=(skills/*/)
          if [ ${#skills[@]} -eq 0 ]; then
            echo "Error: No skill directories found"
            exit 1
          fi
          for dir in "${skills[@]}"; do
            [ -f "$dir/SKILL.md" ] || { echo "Missing SKILL.md in $dir"; exit 1; }
            [ -f "$dir/README.md" ] || { echo "Missing README.md in $dir"; exit 1; }
          done
          echo "✅ All ${#skills[@]} skills have required files"
        continue-on-error: false

      - name: Check formatting
        run: npm run format:check
        continue-on-error: false

  apm-marketplace:
    name: APM marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install APM CLI
        run: |
          curl -sSL https://aka.ms/apm-unix | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify APM version
        run: apm --version

      - name: Validate apm.yml schema
        run: apm pack --dry-run

      - name: Verify marketplace.json is up-to-date
        run: |
          apm pack
          if ! git diff --quiet .claude-plugin/marketplace.json; then
            echo "::error::marketplace.json is stale. Run 'apm pack' locally and commit the result."
            git --no-pager diff .claude-plugin/marketplace.json
            exit 1
          fi

  test-semantic-search:
    name: Test semantic-search plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/semantic-search
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Test
        run: uv run pytest -v
