name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run markdownlint
        run: npm run lint:md
        continue-on-error: false

      - name: Run ls-lint
        run: npx ls-lint
        continue-on-error: false

      - name: Check required skill files
        run: |
          for dir in skills/*/; do
            [ -f "$dir/SKILL.md" ] || { echo "Missing SKILL.md in $dir"; exit 1; }
            [ -f "$dir/README.md" ] || { echo "Missing README.md in $dir"; exit 1; }
          done
        continue-on-error: false

      - name: Check formatting
        run: npm run format:check
        continue-on-error: false
