name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dispatch-to-homebrew:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Dispatch to homebrew-tools
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TAP_REPO_TOKEN }}
          repository: cajias/homebrew-tools
          event-type: claude-skills-release
          client-payload: |
            {
              "version": "${{ needs.release-please.outputs.version }}",
              "tag_name": "${{ needs.release-please.outputs.tag_name }}",
              "repository": "claude-skills",
              "release_url": "https://github.com/cajias/claude-skills/releases/tag/${{ needs.release-please.outputs.tag_name }}"
            }
