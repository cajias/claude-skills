name: Copilot Auto-Assign

# Assigns the GitHub Copilot coding agent to any issue cajias opens, so it starts
# working autonomously and opens a fix PR on its own. This uses GitHub's plain
# "add an assignee" REST endpoint rather than the older GraphQL
# suggestedActors/replaceActorsForAssignable dance — GitHub now accepts the bot's
# handle there directly, so there's no bespoke API-plumbing to maintain here.
#
# Prerequisites this workflow file cannot set up by itself:
#   1. Copilot coding agent must be enabled for this repo: Settings > Copilot > Coding agent.
#      cajias needs a Copilot seat (Pro+, Business, or Enterprise) with coding-agent access.
#   2. Add a repo secret `COPILOT_ASSIGN_PAT`: a fine-grained PAT belonging to cajias with
#      read/write access to Actions, Contents, Issues, and Pull requests. The default
#      GITHUB_TOKEN can't be used here — Copilot assignment must be attributed to the
#      licensed human account, not the github-actions bot, or the API call is rejected.
#
# Review + CI shepherding are intentionally not wired up here:
#   - Turn on Settings > Code review > "Copilot code review" > automatically request a
#     review on every pull request. That covers "have another Copilot review the PR"
#     without guessing at the reviewer bot's exact login in a workflow. Note: this only
#     triggers the *first* review on PR open — GitHub currently has no API to trigger a
#     re-review after Copilot pushes new commits, so a human still clicks "re-request
#     review" for follow-up passes.
#   - The coding agent already watches its own open PRs and reacts to new CI failures
#     and review comments on its own, so no extra "shepherd until green" step is needed.
#     It stops and asks for input if it gets stuck; auto-merge is a separate opt-in
#     (Settings > General > "Allow auto-merge", then enable it per PR) that isn't
#     enabled here since merging without a human look is a bigger call than this
#     workflow makes on its own.
#   - By default GitHub Actions won't even run on Copilot's pushes: it's treated as a
#     first-time outside contributor, so a human has to click "Approve and run
#     workflows" on every new commit, which defeats "autonomous." Settings > Actions >
#     General has a newer option ("skip approval for Copilot coding agent workflows")
#     that removes this gate — turn it on if you want CI to actually run unattended.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign-copilot:
    if: github.event.issue.user.login == 'cajias'
    runs-on: ubuntu-latest
    steps:
      - name: Assign Copilot coding agent to the issue
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::COPILOT_ASSIGN_PAT secret is not set. See the prerequisites in this workflow's header." >&2
            exit 1
          fi

          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/assignees" \
            -f "assignees[]=copilot-swe-agent[bot]"
